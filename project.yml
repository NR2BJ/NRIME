name: NRIME
options:
  bundleIdPrefix: com.nrime.inputmethod
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: ko

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.28.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0.12-beta.12"
    CURRENT_PROJECT_VERSION: "39"

targets:
  NRIME:
    type: application
    platform: macOS
    sources:
      - path: NRIME
        excludes:
          - Resources/Info.plist
          # mozc_server of the versions before Mozc was linked in (git-ignored,
          # kept for building those); it must not ship.
          - Resources/mozc_server
      - path: Shared/InputSourceSelector.swift
        type: file
      - path: Shared/HanjaSelectionStore.swift
        type: file
      - path: Shared/LoginRestorePolicy.swift
        type: file
      - path: Shared/SettingsTransfer.swift
        type: file
      - path: Shared/SettingsModels.swift
        type: file
      - path: Shared/UpdateManager.swift
        type: file
      - path: Shared/SemanticVersion.swift
        type: file
      - path: Shared/DeveloperLogLocation.swift
        type: file
      - path: Shared/AppGroupDefaults.swift
        type: file
      - path: Shared/PermissionStatus.swift
        type: file
      - path: Shared/UserDictionaryReading.swift
        type: file
      - path: Shared/MozcNotifications.swift
        type: file
      - path: Shared/MozcStatus.swift
        type: file
      # The Mozc engine, loaded at run time, and its dictionary data. Built by
      # Tools/mozc/build.sh (build/ is git-ignored: run it once after cloning).
      - path: build/mozc-out/lib/libnrime_mozc.dylib
        buildPhase:
          copyFiles:
            destination: frameworks
        type: file
        optional: true
      - path: build/mozc-out/data/mozc.data
        buildPhase: resources
        type: file
        optional: true
      # "<commit> <commit date> <version>" — shown in Settings > About.
      - path: build/mozc-out/MOZC_VERSION
        buildPhase: resources
        type: file
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nrime.inputmethod.app
        INFOPLIST_FILE: NRIME/Resources/Info.plist
        INSTALL_PATH: /Library/Input Methods
        SKIP_INSTALL: false
        # LSUIElement is set in Info.plist (allows NSStatusItem + windows)
        PRODUCT_NAME: NRIME
        COMBINE_HIDPI_IMAGES: true
        # No @main — we use main.swift
        # Disable automatic code signing for input methods
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: false
    postBuildScripts:
      - script: |
          chmod +x "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"
          if [ ! -f "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/mozc.data" ] \
             || [ ! -f "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libnrime_mozc.dylib" ]; then
            echo "warning: Mozc missing — run Tools/mozc/build.sh; Japanese conversion will not work"
          fi
        name: "Fix executable permissions"
    dependencies:
      - framework: InputMethodKit.framework
        embed: false
      - sdk: Carbon.framework
      - sdk: libsqlite3.tbd
      - package: SwiftProtobuf

  NRIMESettings:
    type: application
    platform: macOS
    sources:
      - path: NRIMESettings
      - path: Shared/HanjaSelectionStore.swift
        type: file
      - path: Shared/SettingsTransfer.swift
        type: file
      - path: Shared/SettingsModels.swift
        type: file
      - path: Shared/UpdateManager.swift
        type: file
      - path: Shared/SemanticVersion.swift
        type: file
      - path: Shared/DeveloperLogLocation.swift
        type: file
      - path: Shared/AppGroupDefaults.swift
        type: file
      - path: Shared/PermissionStatus.swift
        type: file
      - path: Shared/UserDictionaryReading.swift
        type: file
      - path: Shared/MozcNotifications.swift
        type: file
      - path: Shared/MozcStatus.swift
        type: file
      - path: NRIME/Engine/Japanese/Proto/user_dictionary_storage.pb.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nrime.settings
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: NRIMESettings
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: false
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    info:
      path: NRIMESettings/Info.plist
      properties:
        # A regular app while open: Dock icon and app switcher, quits when its
        # window closes (SettingsAppDelegate).
        LSUIElement: false
        CFBundleDisplayName: "NRIME 설정"
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    postBuildScripts:
      - script: chmod +x "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"
        name: "Fix executable permissions"
    dependencies:
      - package: SwiftProtobuf

  NRIMETests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NRIMETests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nrime.inputmethod.app.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: false
    dependencies:
      - target: NRIME
